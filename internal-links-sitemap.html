<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内部リンク サイトマップ（マインドマップ）| エアコン修理サイト</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2129;
    --panel-border: #2c3640;
    --text: #e6edf3;
    --text-dim: #9aa7b2;
    --accent: #4dabf7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif; overflow: hidden; }
  #app { display: flex; height: 100vh; }

  /* Sidebar */
  #sidebar {
    width: 320px;
    flex: 0 0 320px;
    background: var(--panel);
    border-right: 1px solid var(--panel-border);
    padding: 16px;
    overflow-y: auto;
    z-index: 10;
  }
  #sidebar h1 { font-size: 16px; margin: 0 0 4px; }
  #sidebar .sub { font-size: 12px; color: var(--text-dim); margin: 0 0 14px; }
  #sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); margin: 16px 0 8px; border-bottom: 1px solid var(--panel-border); padding-bottom: 4px; }

  #search {
    width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--panel-border);
    background: #0d1218; color: var(--text); font-size: 13px;
  }
  #search:focus { outline: 1px solid var(--accent); }

  .filter-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin: 6px 0; cursor: pointer; }
  .filter-row input { accent-color: var(--accent); }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; flex: 0 0 12px; }
  .line-swatch { display: inline-block; width: 22px; height: 2px; flex: 0 0 22px; }

  .legend-group { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin: 5px 0; }

  #info-panel {
    font-size: 12.5px; line-height: 1.6;
  }
  #info-panel .empty { color: var(--text-dim); }
  #info-panel .node-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  #info-panel .node-url { color: var(--accent); font-size: 11.5px; word-break: break-all; display: block; margin-bottom: 8px; }
  #info-panel .stat-row { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px dashed var(--panel-border); }
  #info-panel ul { margin: 4px 0 10px; padding-left: 18px; }
  #info-panel li { margin: 2px 0; }
  #info-panel .edge-type-label { font-size: 10.5px; color: var(--text-dim); margin-left: 4px; }
  #info-panel a { color: var(--text); text-decoration: none; }
  #info-panel a:hover { color: var(--accent); text-decoration: underline; }
  #info-panel .badge {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 6px; background: #2c3640; color: var(--text-dim);
  }
  #info-panel .badge.orphan { background: #5c1f1f; color: #ffb4b4; }

  .reset-btn {
    margin-top: 10px; width: 100%; padding: 6px; font-size: 12px; border-radius: 6px; border: 1px solid var(--panel-border);
    background: #0d1218; color: var(--text); cursor: pointer;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Graph */
  #graph-wrap { flex: 1; position: relative; }
  svg { display: block; width: 100%; height: 100%; }
  .node circle { stroke: #0f1419; stroke-width: 1.5px; cursor: pointer; }
  .node text {
    font-size: 10px; fill: var(--text); pointer-events: none; paint-order: stroke;
    stroke: var(--bg); stroke-width: 3px;
  }
  .node.dimmed { opacity: 0.08; }
  .link.dimmed { opacity: 0.03; }
  .link { fill: none; }

  #tooltip {
    position: absolute; pointer-events: none; background: rgba(15,20,25,0.95); border: 1px solid var(--panel-border);
    padding: 6px 10px; border-radius: 6px; font-size: 12px; max-width: 280px; display: none; z-index: 20;
  }

  #stats-bar {
    position: absolute; bottom: 10px; left: 10px; font-size: 11px; color: var(--text-dim);
    background: rgba(26,33,41,0.8); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--panel-border);
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>内部リンク サイトマップ</h1>
    <p class="sub">記事23本・商品21点・ハブページ8つの内部リンク関係をマインドマップ化したものです。ノードをクリックすると詳細とつながりが表示されます。</p>

    <input id="search" type="text" placeholder="記事・商品名で検索...">

    <h2>表示するリンクの種類</h2>
    <label class="filter-row"><input type="checkbox" data-edge-type="nav" checked> <span class="line-swatch" style="background:#5b6b7a"></span> ナビゲーション（ハブ→記事/商品）</label>
    <label class="filter-row"><input type="checkbox" data-edge-type="article-article" checked> <span class="line-swatch" style="background:#4dabf7"></span> 記事 → 記事（関連3本）</label>
    <label class="filter-row"><input type="checkbox" data-edge-type="article-product" checked> <span class="line-swatch" style="background:#51cf66"></span> 記事 → 商品</label>
    <label class="filter-row"><input type="checkbox" data-edge-type="product-article" checked> <span class="line-swatch" style="background:#ffa94d"></span> 商品 → 記事</label>
    <label class="filter-row"><input type="checkbox" data-edge-type="product-product" checked> <span class="line-swatch" style="background:#cc5de8"></span> 商品 → 関連商品</label>

    <h2>ノードの色（カテゴリ）</h2>
    <div class="legend-group"><span class="swatch" style="background:#8a98a8"></span> ハブページ</div>
    <div class="legend-group"><span class="swatch" style="background:#4dabf7"></span> 記事: 基礎知識</div>
    <div class="legend-group"><span class="swatch" style="background:#ff6b6b"></span> 記事: 症状</div>
    <div class="legend-group"><span class="swatch" style="background:#20c997"></span> 記事: 掃除・予防</div>
    <div class="legend-group"><span class="swatch" style="background:#ffd43b"></span> 記事: 節電</div>
    <div class="legend-group"><span class="swatch" style="background:#9775fa"></span> 記事: 買い替え</div>
    <div class="legend-group"><span class="swatch" style="background:#22b8cf"></span> 記事: 求人・仕事</div>
    <div class="legend-group"><span class="swatch" style="background:#69db7c"></span> 商品: 補助用品</div>
    <div class="legend-group"><span class="swatch" style="background:#f783ac"></span> 商品: 本体候補</div>
    <p class="sub" style="margin-top:6px;">円の大きさ＝そのページへの内部リンク本数（被リンク数）。小さいノードは内部リンクが少なめです。</p>

    <h2>詳細</h2>
    <div id="info-panel"><p class="empty">ノードをクリックすると、そのページの内部リンク一覧が表示されます。</p></div>
    <button class="reset-btn" id="reset-btn">選択をリセット</button>
  </aside>

  <div id="graph-wrap">
    <svg id="graph"></svg>
    <div id="tooltip"></div>
    <div id="stats-bar"></div>
  </div>
</div>

const groupColor = {
  hub: "#8a98a8",
  basics: "#4dabf7",
  symptom: "#ff6b6b",
  cleaning: "#20c997",
  "energy-saving": "#ffd43b",
  buying: "#9775fa",
  career: "#22b8cf",
  support: "#69db7c",
  replacement: "#f783ac"
};

const edgeColor = {
  nav: "#5b6b7a",
  "article-article": "#4dabf7",
  "article-product": "#51cf66",
  "product-article": "#ffa94d",
  "product-product": "#cc5de8"
};

const typeOrder = { hub: 0, article: 1, product: 2 };

const nodes = DATA.nodes.map(d => ({...d}));
const nodeById = new Map(nodes.map(n => [n.id, n]));

// content in-degree (excluding nav) used for sizing
const contentIndeg = new Map();
DATA.edges.forEach(e => {
  if (e.type !== "nav") {
    contentIndeg.set(e.target, (contentIndeg.get(e.target) || 0) + 1);
  }
});

function nodeRadius(d) {
  if (d.type === "hub") return 22;
  const ci = contentIndeg.get(d.id) || 0;
  return 6 + Math.min(ci, 20) * 0.9;
}

const links = DATA.edges.map(e => ({...e}));

const width = window.innerWidth - 320;
const height = window.innerHeight;

const svg = d3.select("#graph")
  .attr("viewBox", [0, 0, width, height]);

const g = svg.append("g");

svg.call(d3.zoom()
  .scaleExtent([0.15, 4])
  .on("zoom", (event) => g.attr("transform", event.transform)));

// Arrow markers per edge type
const defs = svg.append("defs");
Object.entries(edgeColor).forEach(([type, color]) => {
  defs.append("marker")
    .attr("id", `arrow-${type}`)
    .attr("viewBox", "0 -5 10 10")
    .attr("refX", 8)
    .attr("refY", 0)
    .attr("markerWidth", 6)
    .attr("markerHeight", 6)
    .attr("orient", "auto")
    .append("path")
    .attr("d", "M0,-5L10,0L0,5")
    .attr("fill", color);
});

const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(l => l.type === "nav" ? 90 : 70).strength(l => l.type === "nav" ? 0.15 : 0.35))
  .force("charge", d3.forceManyBody().strength(-160))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collide", d3.forceCollide(d => nodeRadius(d) + 4));

const linkGroup = g.append("g").attr("class", "links");
const nodeGroup = g.append("g").attr("class", "nodes");

const linkSel = linkGroup.selectAll("path")
  .data(links)
  .join("path")
  .attr("class", d => `link link-${d.type}`)
  .attr("stroke", d => edgeColor[d.type])
  .attr("stroke-width", d => d.type === "nav" ? 0.6 : 1.3)
  .attr("stroke-opacity", d => d.type === "nav" ? 0.25 : 0.55)
  .attr("marker-end", d => `url(#arrow-${d.type})`);

const nodeSel = nodeGroup.selectAll("g.node")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(drag(simulation));

nodeSel.append("circle")
  .attr("r", nodeRadius)
  .attr("fill", d => groupColor[d.group] || "#ccc")
  .attr("stroke", d => d.type === "hub" ? "#fff" : "#0f1419")
  .attr("stroke-width", d => d.type === "hub" ? 2 : 1.2);

nodeSel.append("text")
  .attr("dy", d => -(nodeRadius(d) + 4))
  .attr("text-anchor", "middle")
  .text(d => d.type === "hub" ? `[${d.label}]` : (d.label.length > 14 ? d.label.slice(0, 13) + "…" : d.label));

nodeSel.on("click", (event, d) => selectNode(d));

nodeSel.on("mouseover", (event, d) => {
  tooltip.style.display = "block";
  tooltip.innerHTML = `<strong>${d.label}</strong><br><span style="color:#9aa7b2">${d.url}</span><br>被リンク(コンテンツ内): ${contentIndeg.get(d.id) || 0} / 発リンク総数: ${d.outdeg}`;
});
nodeSel.on("mousemove", (event) => {
  tooltip.style.left = (event.pageX + 14) + "px";
  tooltip.style.top = (event.pageY + 8) + "px";
});
nodeSel.on("mouseout", () => { tooltip.style.display = "none"; });

const tooltip = document.getElementById("tooltip");

simulation.on("tick", () => {
  linkSel.attr("d", d => {
    const sx = d.source.x, sy = d.source.y, tx = d.target.x, ty = d.target.y;
    const dx = tx - sx, dy = ty - sy;
    const dr = Math.sqrt(dx*dx + dy*dy) || 1;
    // slight curve so bidirectional edges don't fully overlap
    const curve = Math.min(dr * 0.18, 40);
    const mx = (sx + tx) / 2 + (dy / dr) * curve * (d.type === "nav" ? 0 : 1) * (d.curveSign || 1);
    const my = (sy + ty) / 2 - (dx / dr) * curve * (d.type === "nav" ? 0 : 1) * (d.curveSign || 1);
    return `M${sx},${sy} Q${mx},${my} ${tx},${ty}`;
  });
  nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
});

// alternate curve direction for opposite-direction pairs (e.g. article-article mutual links)
const pairSeen = new Set();
links.forEach(l => {
  const key1 = `${l.source.id || l.source}->${l.target.id || l.target}`;
  const key2 = `${l.target.id || l.target}->${l.source.id || l.source}`;
  if (pairSeen.has(key2)) {
    l.curveSign = -1;
  } else {
    l.curveSign = 1;
  }
  pairSeen.add(key1);
});

function drag(sim) {
  function dragstarted(event, d) {
    if (!event.active) sim.alphaTarget(0.2).restart();
    d.fx = d.x; d.fy = d.y;
  }
  function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
  function dragended(event, d) {
    if (!event.active) sim.alphaTarget(0);
    d.fx = null; d.fy = null;
  }
  return d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended);
}

// ----- Filters -----
const activeTypes = new Set(["nav", "article-article", "article-product", "product-article", "product-product"]);
document.querySelectorAll('input[data-edge-type]').forEach(cb => {
  cb.addEventListener("change", () => {
    const type = cb.dataset.edgeType;
    if (cb.checked) activeTypes.add(type); else activeTypes.delete(type);
    applyEdgeFilter();
  });
});

function applyEdgeFilter() {
  linkSel.style("display", d => activeTypes.has(d.type) ? null : "none");
}

// ----- Selection / highlight -----
let selectedId = null;

function selectNode(d) {
  selectedId = d.id;
  highlight();
  renderInfo(d);
}

function highlight() {
  if (!selectedId) {
    nodeSel.classed("dimmed", false);
    linkSel.classed("dimmed", false);
    return;
  }
  const neighborIds = new Set([selectedId]);
  links.forEach(l => {
    const s = l.source.id || l.source, t = l.target.id || l.target;
    if (s === selectedId) neighborIds.add(t);
    if (t === selectedId) neighborIds.add(s);
  });
  nodeSel.classed("dimmed", d => !neighborIds.has(d.id));
  linkSel.classed("dimmed", l => {
    const s = l.source.id || l.source, t = l.target.id || l.target;
    return !(s === selectedId || t === selectedId);
  });
}

document.getElementById("reset-btn").addEventListener("click", () => {
  selectedId = null;
  highlight();
  document.getElementById("info-panel").innerHTML = '<p class="empty">ノードをクリックすると、そのページの内部リンク一覧が表示されます。</p>';
  document.getElementById("search").value = "";
});

const edgeTypeLabel = {
  "nav": "ナビゲーション",
  "article-article": "関連記事",
  "article-product": "関連商品",
  "product-article": "関連記事",
  "product-product": "関連商品"
};

function renderInfo(d) {
  const outs = links.filter(l => (l.source.id || l.source) === d.id);
  const ins = links.filter(l => (l.target.id || l.target) === d.id);
  const ci = contentIndeg.get(d.id) || 0;
  const orphanBadge = (d.type !== "hub" && ci === 0)
    ? '<span class="badge orphan">コンテンツからの被リンクなし</span>' : "";

  const outsByType = {};
  outs.forEach(l => {
    if (l.type === "nav") return;
    (outsByType[l.type] = outsByType[l.type] || []).push(l);
  });
  const insByType = {};
  ins.forEach(l => {
    if (l.type === "nav") return;
    (insByType[l.type] = insByType[l.type] || []).push(l);
  });
  const navIn = ins.filter(l => l.type === "nav");
  const navOut = outs.filter(l => l.type === "nav");

  function listLinks(arr, dir) {
    return arr.map(l => {
      const otherId = dir === "out" ? (l.target.id || l.target) : (l.source.id || l.source);
      const other = nodeById.get(otherId);
      const labelTxt = l.label ? `<span class="edge-type-label">(${l.label})</span>` : "";
      return `<li><a href="#" data-goto="${otherId}">${other.label}</a>${labelTxt}</li>`;
    }).join("");
  }

  let html = `<div class="node-title">${d.label}</div>`;
  html += `<span class="node-url">${d.url}${orphanBadge}</span>`;
  html += `<div class="stat-row"><span>被リンク（記事/商品リンクのみ）</span><strong>${ci}</strong></div>`;
  html += `<div class="stat-row"><span>発リンク総数</span><strong>${d.outdeg}</strong></div>`;

  Object.entries(outsByType).forEach(([type, arr]) => {
    html += `<h2 style="margin-top:10px;">→ ${edgeTypeLabel[type]} (${arr.length})</h2><ul>${listLinks(arr, "out")}</ul>`;
  });
  Object.entries(insByType).forEach(([type, arr]) => {
    html += `<h2 style="margin-top:10px;">← ${edgeTypeLabel[type]}元 (${arr.length})</h2><ul>${listLinks(arr, "in")}</ul>`;
  });
  if (navOut.length) {
    html += `<h2 style="margin-top:10px;">→ ナビゲーション (${navOut.length})</h2><ul>${listLinks(navOut, "out")}</ul>`;
  }
  if (navIn.length) {
    html += `<h2 style="margin-top:10px;">← ナビゲーション元 (${navIn.length})</h2><ul>${listLinks(navIn, "in")}</ul>`;
  }

  const panel = document.getElementById("info-panel");
  panel.innerHTML = html;
  panel.querySelectorAll("[data-goto]").forEach(a => {
    a.addEventListener("click", (e) => {
      e.preventDefault();
      const target = nodeById.get(a.dataset.goto);
      if (target) selectNode(target);
    });
  });
}

// ----- Search -----
document.getElementById("search").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) {
    nodeSel.classed("dimmed", false);
    return;
  }
  selectedId = null;
  linkSel.classed("dimmed", true);
  nodeSel.classed("dimmed", d => !(d.label.toLowerCase().includes(q) || d.id.toLowerCase().includes(q)));
});

// ----- Stats bar -----
const orphans = nodes.filter(n => n.type !== "hub" && (contentIndeg.get(n.id) || 0) === 0);
document.getElementById("stats-bar").innerHTML =
  `ノード: ${nodes.length}（記事23・商品21・ハブ8） / リンク: ${links.length}` +
  (orphans.length ? ` / <span style="color:#ffb4b4;">コンテンツ被リンク0: ${orphans.map(o=>o.label).join("、")}</span>` : "");

applyEdgeFilter();
</script>
</body>
</html>
